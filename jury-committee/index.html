:root[data-theme="dark"]{--bg:#130E31;--panel:#1D1750;--ink:#F1EEFA;--ink-2:#BDB6D8;--line:#33297A;--violet:#B596DE;--indigo:#8F7BE0;--peri:#9C90E6;--tint:#241D5E;--teal:#3CC9C9;--teal-deep:#3CC9C9;--teal-tint:#123F4A}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Poppins",system-ui,sans-serif;font-weight:400;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.hero{background:var(--grad);color:#fff;border-bottom:4px solid var(--teal);position:relative;overflow:hidden;padding:48px 0 40px}
.hero .rings{position:absolute;right:-60px;top:-70px;width:420px;height:420px;pointer-events:none}
.hero .rings i{position:absolute;border:1px solid rgba(255,255,255,.2);border-radius:50%}
.hero .rings i:nth-child(1){inset:0}.hero .rings i:nth-child(2){inset:60px}.hero .rings i:nth-child(3){inset:120px;border-color:rgba(18,163,163,.3)}
@media(max-width:760px){.hero .rings{display:none}}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.85}
h1{font-weight:300;font-size:clamp(30px,5vw,48px);line-height:1.1;margin:10px 0 0}
h1 b{font-weight:700;background:linear-gradient(transparent 62%,rgba(255,233,77,.55) 62%)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:28px 0 8px}
.chip{font:inherit;font-size:13px;font-weight:700;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--indigo);color:#fff;border-color:var(--indigo)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#130E31}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#130E31}}
.chip small{font-weight:400;opacity:.8;margin-left:4px}
.search{flex:1;min-width:180px;font:inherit;font-size:14px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.theme{font:inherit;font-size:12px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);cursor:pointer}
h2{font-weight:300;font-size:26px;margin:28px 0 18px}
h2::after{content:"";display:block;width:40px;height:3px;background:var(--teal);margin-top:8px}
h2 b{font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}
.stat{background:var(--panel);border-top:3px solid var(--teal);padding:14px 16px}
.stat .n{font-size:30px;font-weight:300;line-height:1.1}.stat .l{font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:48px}
.card{background:var(--panel);display:flex;flex-direction:column}
.ph{aspect-ratio:1/1;background:var(--grad);position:relative;overflow:hidden}
.ph img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
.ph .ini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:300;font-size:56px;letter-spacing:.04em}
.body{padding:14px 16px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.tag{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--tint);color:var(--peri)}
.tag.c{background:var(--teal-tint);color:var(--teal-deep)}
.name{font-size:18px;font-weight:700;line-height:1.25;margin-top:2px}
.title{font-size:13.5px;color:var(--ink-2);font-weight:300}
.inst{font-size:13.5px;font-weight:700;color:var(--teal-deep);margin-top:auto;padding-top:6px}
.empty{display:none;color:var(--ink-2);padding:30px 0}
footer{background:var(--grad);border-top:4px solid var(--teal);color:#fff;padding:22px 0;font-size:13px;font-weight:300}
</style>
</head>
<body>
<header class="hero"><div class="rings"><i></i><i></i><i></i></div><div class="wrap">
<div class="eyebrow">SciComms Awards · 2026</div>
<h1><b>Jury</b> &amp; <b>Committee</b></h1>
</div></header>
<main class="wrap">
<div class="stats"><div class="stat"><div class="n">31</div><div class="l">Members</div></div><div class="stat"><div class="n">20</div><div class="l">Jury</div></div><div class="stat"><div class="n">11</div><div class="l">Committee</div></div></div>
<div class="toolbar">
<button class="chip" data-f="all" aria-pressed="true">All<small>31</small></button>
<button class="chip" data-f="J" aria-pressed="false">Jury<small>20</small></button>
<button class="chip" data-f="C" aria-pressed="false">Committee<small>11</small></button>
<input class="search" type="search" placeholder="Search name, title or institution" aria-label="Search">
<button class="theme" id="theme" type="button">Theme</button>
</div>
<h2 id="h"><b>Everyone</b></h2>
<div class="grid" id="grid"></div>
<div class="empty" id="empty">No one matches that search.</div>
</main>
<footer><div class="wrap">SciComms Awards 2026 · Schmidt Sciences</div></footer>
<script>
const PEOPLE=[{"n":"Tim Appenzeller","s":"tim-appenzeller","r":"C","chair":false,"t":"News Editor","i":"Science, AAAS"},{"n":"Andrea Bandelli","s":"andrea-bandelli","r":"J","chair":false,"t":"Independent Advisor and Consultant in Science Communication","i":"ScienceCulture"},{"n":"Heather Berlin","s":"heather-berlin","r":"J","chair":false,"t":"Professor of Psychiatry and Neuroscience","i":"Icahn School of Medicine at Mount Sinai"},{"n":"David Biello","s":"david-biello","r":"C","chair":false,"t":"Curator","i":"TED Conferences"},{"n":"Cynthia Coleman","s":"cynthia-coleman","r":"J","chair":false,"t":"Professor","i":"Portland State University"},{"n":"Chris Crawford","s":"chris-crawford","r":"C","chair":false,"t":"Associate Professor of Computer Science","i":"University of Alabama"},{"n":"Beth Daley","s":"beth-daley","r":"C","chair":false,"t":"Executive Editor and General Manager","i":"The Conversation"},{"n":"Nadia Drake","s":"nadia-drake","r":"C","chair":false,"t":"Freelance Science Journalist","i":"Freelance / Independent"},{"n":"Jordan Ellenberg","s":"jordan-ellenberg","r":"J","chair":false,"t":"John D. MacArthur Professor of Mathematics","i":"University of Wisconsin-Madison"},{"n":"Mary Flanagan","s":"mary-flanagan","r":"J","chair":false,"t":"Professor of Film and Media Studies and Director, Tiltfactor Laboratory","i":"Dartmouth College"},{"n":"Adam Fontecchio","s":"adam-fontecchio","r":"J","chair":false,"t":"Professor","i":"Drexel University"},{"n":"Corey Gray","s":"corey-gray","r":"J","chair":false,"t":"Detector Operations Specialist","i":"California Institute of Technology (Caltech)"},{"n":"Erika Check Hayden","s":"erika-check-hayden","r":"C","chair":false,"t":"Director and Teaching Professor, Science Communication Program","i":"University of California, Santa Cruz"},{"n":"Laura Helmuth","s":"laura-helmuth","r":"C","chair":false,"t":"Freelance Editor, Writer, and Consultant; Advice Columnist for Slate","i":"Freelance / Independent"},{"n":"Katelyn Jetelina","s":"katelyn-jetelina","r":"J","chair":false,"t":"Founder and Chief Executive Officer; Assistant Professor Adjunct of Epidemiology (Chronic Diseases)","i":"Your Local Epidemiologist"},{"n":"Maggie Koerth","s":"maggie-koerth","r":"J","chair":false,"t":"Editor for Climate and Weather","i":"CNN"},{"n":"Ron Latanision","s":"ron-latanision","r":"C","chair":false,"t":"Professor Emeritus of Materials Science and Engineering and of Nuclear Engineering; Director Emeritus, H.H. Uhlig Corrosion Laboratory; Senior Fellow and Principal Scientist","i":"Massachusetts Institute of Technology (MIT)"},{"n":"Kara Lavender Law","s":"kara-lavender-law","r":"J","chair":false,"t":"Research Professor","i":"Sea Education Association"},{"n":"Melissa Cristina Márquez","s":"melissa-cristina-marquez","r":"J","chair":false,"t":"Marine Biologist and Science Communicator","i":"The Fins United Initiative"},{"n":"Deborah Nelson","s":"deborah-nelson","r":"J","chair":false,"t":"Professor","i":"University of Maryland"},{"n":"Joe Palca","s":"joe-palca","r":"J","chair":false,"t":"Freelance Science Journalist","i":"Freelance / Independent"},{"n":"Enrico Ramirez-Ruiz","s":"enrico-ramirez-ruiz","r":"J","chair":false,"t":"Professor of Astronomy and Astrophysics and Director of the Center for Reimagining Leadership","i":"University of California, Santa Cruz"},{"n":"Megan Ranney","s":"megan-ranney","r":"C","chair":true,"t":"Dean","i":"Yale University"},{"n":"Czerne Reid","s":"czerne-reid","r":"J","chair":false,"t":"Instructional Associate Professor","i":"University of Florida"},{"n":"Gustavo Rincon","s":"gustavo-rincon","r":"J","chair":false,"t":"Advanced Design Research Director and Curator","i":"University of California, Santa Barbara"},{"n":"Moira Shourie","s":"moira-shourie","r":"C","chair":false,"t":"Executive Director","i":"Zocalo Public Square"},{"n":"Tom Skalak","s":"tom-skalak","r":"J","chair":false,"t":"Senior Advisor to the Founders","i":"Joe and Clara Tsai Foundation"},{"n":"Alison Snyder","s":"alison-snyder","r":"J","chair":false,"t":"Senior Writer","i":"Google DeepMind"},{"n":"Monique Verdin","s":"monique-verdin","r":"J","chair":false,"t":"Director","i":"The Land Memory Bank & Seed Exchange"},{"n":"Dan Vergano","s":"dan-vergano","r":"J","chair":false,"t":"Director of Science Policy News","i":"American Institute of Physics (AIP)"},{"n":"Janelle Wellons","s":"janelle-wellons","r":"C","chair":false,"t":"Senior Space Mission Operations Engineer","i":"Project Pearl, LLC"}];
const grid=document.getElementById('grid'),empty=document.getElementById('empty'),h=document.getElementById('h');
let f='all',q='';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ini=n=>n.split(' ').filter(w=>/^[A-Za-zÀ-ž]/.test(w)).map(w=>w[0]).slice(0,2).join('');
function render(){
  const list=PEOPLE.filter(p=>(f==='all'||p.r===f)&&(!q||(p.n+' '+p.t+' '+p.i).toLowerCase().includes(q)));
  grid.innerHTML=list.map(p=>`<article class="card"><div class="ph"><div class="ini">${esc(ini(p.n))}</div><img src="photos/${p.s}.jpg" alt="${esc(p.n)}" loading="lazy" onerror="this.remove()"></div><div class="body"><span class="tag ${p.r==='C'?'c':''}">${p.r==='C'?(p.chair?'Committee Chair':'Committee'):'Jury'}</span><div class="name">${esc(p.n)}</div><div class="title">${esc(p.t)}</div><div class="inst">${esc(p.i)}</div></div></article>`).join('');
  empty.style.display=list.length?'none':'block';
  h.innerHTML='<b>'+(f==='J'?'Jury':f==='C'?'Committee':'Everyone')+'</b> · '+list.length;
}
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{f=b.dataset.f;document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
document.querySelector('.search').oninput=e=>{q=e.target.value.trim().toLowerCase();render()};
document.getElementById('theme').onclick=()=>{const r=document.documentElement;const d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};
render();
</script>
</body>
</html>
