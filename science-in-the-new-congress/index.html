<head>

<title>Science in the New Congress</title>
<style>
:root{
  --bg:#FFFFFF;--panel:#F6F0E8;--ink:#23282E;--ink-2:#58606A;--ink-3:#6B737C;
  --line:#E6DED4;--line-strong:#C5BAAF;
  --moss:#424B54;--moss-tint:#E4E7EA;--on-moss:#FFFFFF;--fern:#424B54;--on-fern:#FFFFFF;
  --gold:#E1CE7A;--ochre:#B39A2E;--ochre-tint:#F3EAC0;--berry:#8A5A44;--berry-tint:#EBCFB2;
  --c1:#424B54;--c2:#E1CE7A;--c3:#B5855A;--c4:#B5855A;--c5:#C5BAAF;
  --s1:#F6EDB8;--s1t:#23282E;--s2:#E1CE7A;--s2t:#23282E;--s3:#B09A2A;--s3t:#FFFFFF;--s4:#6E5F0E;--s4t:#FFFFFF;
  --dem:#1F5FBF;--dem-tint:#DCE8F8;--rep:#C0262D;--rep-tint:#F8DEDF;
  --gutter:max(16px,env(safe-area-inset-left));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1E2329;--panel:#2A3038;--ink:#F2EEE8;--ink-2:#C5BAAF;--ink-3:#A9A096;--line:#3D454E;--line-strong:#59626C;
  --moss:#E1CE7A;--moss-tint:#3B3A2A;--on-moss:#23282E;--fern:#2A3038;--on-fern:#F2EEE8;
  --gold:#E1CE7A;--ochre:#E8D58C;--ochre-tint:#4A432A;--berry:#EBCFB2;--berry-tint:#4A3F38;
  --c1:#C5BAAF;--c2:#E1CE7A;--c3:#C99A6B;--c4:#C99A6B;--c5:#F2EEE8;
  --s1:#EBDF9E;--s1t:#23282E;--s2:#CDB95A;--s2t:#23282E;--s3:#98842A;--s3t:#FFFFFF;--s4:#675A12;--s4t:#FFFFFF;
  --dem:#7FB0F2;--dem-tint:#1F3350;--rep:#F08A8F;--rep-tint:#4A2528}}
:root[data-theme="dark"]{
  --bg:#1E2329;--panel:#2A3038;--ink:#F2EEE8;--ink-2:#C5BAAF;--ink-3:#A9A096;--line:#3D454E;--line-strong:#59626C;
  --moss:#E1CE7A;--moss-tint:#3B3A2A;--on-moss:#23282E;--fern:#2A3038;--on-fern:#F2EEE8;
  --gold:#E1CE7A;--ochre:#E8D58C;--ochre-tint:#4A432A;--berry:#EBCFB2;--berry-tint:#4A3F38;
  --c1:#C5BAAF;--c2:#E1CE7A;--c3:#C99A6B;--c4:#C99A6B;--c5:#F2EEE8;
  --s1:#EBDF9E;--s1t:#23282E;--s2:#CDB95A;--s2t:#23282E;--s3:#98842A;--s3t:#FFFFFF;--s4:#675A12;--s4t:#FFFFFF;
  --dem:#7FB0F2;--dem-tint:#1F3350;--rep:#F08A8F;--rep-tint:#4A2528}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden}
h1,h2,h3{font-weight:600;line-height:1.2;margin:0}
p{margin:0}
a{color:var(--moss)}
:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 0 var(--gutter)}
/* masthead */
header.mast{background:var(--panel);color:var(--ink);border-bottom:4px solid var(--gold);border-radius:0;position:relative;overflow:hidden;padding:max(22px,env(safe-area-inset-top)) 0 26px}
header.mast .wrap{position:relative;z-index:1}
.mast h1{font-size:clamp(26px,5vw,36px);padding-right:112px}
.mast p{opacity:.88;margin-top:6px;max-width:52ch}
.pebble{position:absolute;border-radius:60% 40% 55% 45%/50% 60% 40% 50%;pointer-events:none}
.pb1{width:150px;height:110px;right:9%;top:-30px;background:#B9831A;opacity:.22}
.pb2{width:110px;height:90px;right:2%;bottom:-24px;background:#55663A;opacity:.5}
.pb3{width:70px;height:56px;right:22%;bottom:10px;background:#6A3B56;opacity:.45}
@media(max-width:760px){.pebble{display:none}}
.theme{position:absolute;top:0;right:0;z-index:2;background:transparent;color:var(--ink);border:1px solid var(--line-strong);border-radius:8px;font:inherit;font-size:14px;padding:6px 12px;min-height:36px;cursor:pointer}
.mast .wrap{padding-top:2px}
/* tabs */
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:18px 0 4px;scrollbar-width:thin}
nav.tabs button{font:inherit;font-size:15px;white-space:nowrap;min-height:44px;padding:0 16px;background:transparent;color:var(--ink);border:1px solid var(--line-strong);border-radius:8px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--moss);color:var(--on-moss);border-color:var(--moss)}
main{padding:14px 0 40px}
section.panel{display:none}
section.panel.on{display:block}
.head h2{font-size:24px}
.head:after{content:"";display:block;width:44px;height:4px;background:var(--gold);margin:8px 0 16px}
.sub{color:var(--ink-2);margin:-6px 0 14px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{background:var(--panel);border-radius:8px;border-left:5px solid var(--moss);padding:16px 18px}
.stat.o{border-left-color:var(--gold)}.stat.b{border-left-color:var(--ochre)}
.stat{display:flex;gap:14px;align-items:center;justify-content:space-between}.pie{flex:none}.pie circle.bg{fill:var(--line)}.pie circle.sl{fill:none;stroke:var(--moss);stroke-width:32;transform:rotate(-90deg);transform-origin:50% 50%}
.stat .big{font-size:46px;font-weight:600;line-height:1}
.stat .lab{font-weight:600;margin-top:6px}
.stat .meta{color:var(--ink-2);font-size:15px;margin-top:2px}
.delta{font-weight:600}
.delta.up{color:var(--moss)}.delta.dn{color:var(--berry)}
/* chips & pills */
.chip{display:inline-block;font-size:13.5px;line-height:1.3;padding:2px 9px;border-radius:8px;background:var(--moss-tint);color:var(--ink);white-space:nowrap}
.chip.o{background:var(--ochre-tint)}.chip.b{background:var(--berry-tint)}.chip.d{background:var(--dem-tint);color:var(--dem);font-weight:600}.chip.r{background:var(--rep-tint);color:var(--rep);font-weight:600}.chip.l{background:transparent;border:1px solid var(--line-strong)}
.chip.new{background:var(--gold);color:#23282E;font-weight:700;border:1px solid #B39A2E}
.pers.isnew{border-left:4px solid var(--gold);padding-left:10px}
.evd{margin-top:6px}.evd summary{cursor:pointer;font-size:15px;color:var(--ink-2);padding:4px 0;min-height:24px}.evd[open] summary{color:var(--ink);font-weight:600}.evg{margin:8px 0 4px;padding-left:10px;border-left:3px solid var(--line-strong)}.evg .chip{margin-bottom:2px;font-weight:600}.chip.act{background:var(--gold);color:#23282E;border:1px solid #B39A2E}.chip.cmt{background:transparent;border:1px solid var(--line-strong);color:var(--ink-2)}.evnone{margin-top:6px}.evbar{margin:14px 0 0}.evbtn{font:inherit;font-size:15px;color:var(--ink);background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;padding:8px 14px;min-height:40px;cursor:pointer}
.aictl{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;margin:16px 0 8px}.aictl select{font:inherit;font-size:15px;padding:6px 8px;border:1px solid var(--line-strong);border-radius:8px;background:var(--panel);color:var(--ink);min-height:40px}.fxbar{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}.fxb{font:inherit;font-size:14.5px;color:var(--ink);background:var(--panel);border:1px solid var(--line-strong);border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer}.fxb.on{background:var(--moss);color:var(--on-moss);border-color:var(--moss)}.fxb.on .sm{color:inherit}.fxrow{margin:6px 0 2px;display:flex;flex-wrap:wrap;gap:6px}.chip.fchip{background:var(--moss-tint);border:1px solid var(--line-strong);font-weight:600}.chip.fchip.sec{font-weight:400;background:transparent}
.rg{margin:22px 0 4px;font-size:19px}.rsec{margin-top:34px;padding-top:6px;border-top:3px solid var(--gold)}.rh{margin:14px 0 6px;font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
/* fields */
.fgrid{align-items:start;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.fcard{background:var(--panel);border-radius:8px;border-left:5px solid var(--fc);padding:16px 18px;text-align:left;font:inherit;color:inherit;border-top:0;border-right:0;border-bottom:0;cursor:pointer;width:100%;display:block}
.fcard[aria-expanded="true"]{outline:2px solid var(--ink);outline-offset:-2px}
.fcard .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fcard .big{font-size:40px;font-weight:600;line-height:1}
.fcard h3{font-size:17px;margin-bottom:6px}
.fcard .meta{color:var(--ink-2);font-size:15px}
.fcard .chips{margin-top:10px}
.fcard .names{margin-top:10px;font-size:15px;border-top:1px solid var(--line);padding-top:8px}
.fcard .names div{padding:2px 0}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 0}
.dot{width:12px;height:12px;border-radius:50%;background:var(--fc)}
.dot.gone{background:transparent;border:2px solid var(--fc)}
.dot.lead{background:repeating-linear-gradient(45deg,var(--fc) 0 2px,transparent 2px 4px);border:2px solid var(--fc)}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--ink-2);font-size:14.5px;margin:0 0 14px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dot{--fc:var(--moss)}
/* demographics, areas, matrix, roster extras */
.demo{display:grid;gap:14px}
.drow h3{font-size:15px;font-weight:600;margin-bottom:6px}
.pies{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}.pcard{background:var(--panel);border-radius:8px;padding:14px 16px}.pcard h3{font-size:15px;margin-bottom:8px}.pleg{display:flex;flex-direction:column;gap:4px;margin-top:10px;font-size:15px;color:var(--ink-2)}.pleg span{display:inline-flex;gap:6px;align-items:center}.pleg b{color:var(--ink)}
path.sl,circle.sl{cursor:pointer;transition:opacity .15s}
.pies:has(.sl.sel) path.sl:not(.sel),.pies:has(.sl.sel) circle.sl:not(.sel){opacity:.45}
svg.pie2{overflow:visible}
path.sl:focus,circle.sl:focus{outline:none}
path.sl:focus-visible,circle.sl:focus-visible{stroke:var(--ochre);stroke-width:.8}
path.sl.sel,circle.sl.sel{stroke:var(--ink);stroke-width:.7}
button.sl{font:inherit;color:inherit;background:none;border:0;padding:4px 0;min-height:32px;display:inline-flex;gap:6px;align-items:center;cursor:pointer;text-align:left}
button.sl.sel{font-weight:700;text-decoration:underline}
table.ov{max-width:640px}
.dotline{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.dot2{display:inline-block;width:14px;height:14px;border-radius:50%;flex:none;vertical-align:-2px}
.dleg{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--ink-2);font-size:15px}
.dleg span{display:inline-flex;gap:6px;align-items:center}
.dleg b{color:var(--ink)}
.areas{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.ab2{font:inherit;font-size:14.5px;min-height:40px;padding:0 12px;background:transparent;color:var(--ink);border:1px solid var(--line-strong);border-radius:8px;cursor:pointer}
.ab2[aria-pressed="true"]{background:var(--moss);color:var(--on-moss);border-color:var(--moss)}
table.mx{border-collapse:collapse;width:100%;font-size:15px}
table.mx th,table.mx td{border:1px solid var(--line);padding:8px 10px;text-align:center}
table.mx thead th{background:var(--panel);font-weight:600}
table.mx th[scope=row]{text-align:left;font-weight:400;background:var(--bg)}
table.mx tr[data-a]{cursor:pointer}
table.mx tr.sel th[scope=row]{font-weight:700;outline:2px solid var(--ink);outline-offset:-2px}
@media(max-width:640px){table.mx{font-size:13px}table.mx th,table.mx td{padding:6px 4px}}
select{font:inherit;min-height:44px;padding:0 12px;border:1px solid var(--line-strong);background:var(--bg);color:var(--ink);border-radius:8px}
.kv{margin:6px 0}
.kv b{color:var(--ink)}
.row .body ul.m{margin:4px 0 0}
/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:820px){.mapwrap{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;max-width:640px}
.tile{aspect-ratio:1;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);font:inherit;border-radius:8px;padding:0;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;min-width:0}
.tile .ab{font-size:clamp(9px,1.7vw,13px);color:var(--ink-3)}
.tile .n{font-size:clamp(13px,2.6vw,21px);font-weight:600}
.tile.l1{background:var(--s1);border-color:var(--s1);color:var(--s1t)}
.tile.l2{background:var(--s2);border-color:var(--s2);color:var(--s2t)}
.tile.l3{background:var(--s3);border-color:var(--s3);color:var(--s3t)}
.tile.l4{background:var(--s4);border-color:var(--s4);color:var(--s4t)}
.tile.l1 .ab,.tile.l2 .ab,.tile.l3 .ab,.tile.l4 .ab{color:inherit;opacity:.85}
.tile.gov:before{content:"G";position:absolute;bottom:2px;left:3px;font-size:10px;font-weight:700;line-height:1;padding:1px 3px;border-radius:3px;background:var(--gold);color:#23282E;border:1px solid #23282E}
.tile.lead:after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:#B8860B;border:1px solid #fff;box-sizing:content-box}
.tile[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px}
.gl{display:inline-block;font-size:10px;font-weight:700;line-height:1;padding:1px 3px;border-radius:3px;border:1px solid var(--ink);margin-right:5px}
.mapleg{display:flex;gap:14px;flex-wrap:wrap;font-size:14.5px;color:var(--ink-2);margin-top:12px;align-items:center}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px 1px 4px 1px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line-strong)}
.detail{background:var(--panel);border-radius:8px;padding:16px 18px;min-height:120px}
.detail h3{font-size:19px;margin-bottom:8px}
.pers{padding:10px 0;border-top:1px solid var(--line)}
.pers:first-of-type{border-top:0}
.pers .nm{font-weight:600}
.pers .sm{color:var(--ink-2);font-size:15px}
.pers .nt{color:var(--ink-2);font-size:14.5px;margin-top:2px}
/* lists */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:20px}
.panelbox{background:var(--panel);border-radius:8px;padding:16px 18px}
.panelbox h3{font-size:18px;margin-bottom:6px}
.sec{margin-top:26px}
.sec h3{font-size:19px;margin-bottom:10px}
/* roster */
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
input[type=search]{font:inherit;min-height:44px;padding:0 14px;border:1px solid var(--line-strong);background:var(--bg);color:var(--ink);border-radius:8px;flex:1;min-width:200px}
.row{border-top:1px solid var(--line);padding:10px 0}
.row summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.row summary::-webkit-details-marker{display:none}
.row .nm{font-weight:600}
.row .sm{color:var(--ink-2);font-size:15px}
.row .body{padding:8px 0 2px;font-size:15px;color:var(--ink-2)}
@media(max-width:640px){.row summary{grid-template-columns:1fr auto}.row summary .sm2{grid-column:1 / -1}}
.callout{background:var(--ochre-tint);border-left:5px solid var(--ochre);border-radius:8px;padding:12px 16px;margin:14px 0}
.callout.t{background:var(--moss-tint);border-left-color:var(--moss)}
ul.m{margin:6px 0 0;padding-left:20px}
ul.m li{margin:4px 0}
footer.foot{background:var(--panel);color:var(--ink-2);border-top:4px solid var(--gold);border-radius:0;padding:20px 0 max(20px,env(safe-area-inset-bottom));font-size:15px}
footer.foot p{opacity:.9}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

ewsnetwork.com/?p=4904415","c":false,"cat":"P"},{"d":"2025-11-05","t":"Warner and Sen. Hawley introduced the AI-Related Job Impacts Clarity Act, requiring large companies and agencies to report AI-related layoffs to the Labor Department (article date; bill introduction date not stated).","u":"https://m.washingtontimes.com/news/2025/nov/5/new-legislation-senate-would-mandate-reports-ai-related-job-cuts/","c":true,"cat":"P"},{"d":"2026-03-25","t":"At an Axios AI+DC Summit Warner called a proposed moratorium on AI data center construction 'idiocy' and said it would let China move faster (article gives day of week only; date inferred from the URL).","u":"https://www.axios.com/2026/03/25/warner-ai-data-center-moratorium-aoc-idiocy","c":false,"cat":"P"},{"d":"2026-06-07","t":"Warner said he plans comprehensive data center legislation and is cosponsoring the Power for the People Act with Sen. Van Hollen, saying 'we need guardrails on data centers.'","u":"https://www.potomaclocal.com/2026/06/07/warner-seeks-guardrails-on-data-center-power-costs/","c":false,"cat":"P"},{"d":"2026-07-21","t":"Warner unveiled 'A Framework for America's AI Future,' including the Secure AI Development Act (frontier model access for the NSA) and a data center disclosure and tax bill.","u":"https://www.kslaw.com/news-and-insights/from-voluntary-engagement-to-mandatory-access-senator-warner-proposes-new-rules-for-frontier-ai-models-and-data-centers","c":true,"cat":"P"}],"fx":["framework","datacenters","jobs"]},{"id":"X-Nancy Mace","n":"Nancy Mace","c":"H","p":"R","st":"SC","seat":"SC-1","s":"out","nw":0,"deg":"B.A. business, master’s degree","edu":"B.A. business administration, The Citadel (1999); master's degree, University of Georgia (2004; Wikipedia says journalism and mass communication, Ballotpedia gives only 'master's').","bg":"Founded the Mace Group PR and consulting firm (2008); worked at and co-owned FITSNews; ran for U.S. Senate in 2014 (fourth in the primary); Trump 2016 campaign coalitio <script>
(function(){

var GRID={AK:[0,0],ME:[10,0],WI:[5,1],VT:[9,1],NH:[10,1],WA:[0,2],ID:[1,2],MT:[2,2],ND:[3,2],MN:[4,2],IL:[5,2],MI:[6,2],NY:[8,2],MA:[9,2],OR:[0,3],NV:[1,3],WY:[2,3],SD:[3,3],IA:[4,3],IN:[5,3],OH:[6,3],PA:[7,3],NJ:[8,3],CT:[9,3],RI:[10,3],CA:[0,4],UT:[1,4],CO:[2,4],NE:[3,4],MO:[4,4],KY:[5,4],WV:[6,4],VA:[7,4],MD:[8,4],DE:[9,4],AZ:[1,5],NM:[2,5],KS:[3,5],AR:[4,5],TN:[5,5],NC:[6,5],SC:[7,5],OK:[3,6],LA:[4,6],MS:[5,6],AL:[6,6],GA:[7,6],HI:[0,7],TX:[3,7],FL:[8,7]};
var NAMES={AK:'Alaska',AL:'Alabama',AR:'Arkansas',AZ:'Arizona',CA:'California',CO:'Colorado',CT:'Connecticut',DE:'Delaware',FL:'Florida',GA:'Georgia',HI:'Hawaii',IA:'Iowa',ID:'Idaho',IL:'Illinois',IN:'Indiana',KS:'Kansas',KY:'Kentucky',LA:'Louisiana',MA:'Massachusetts',MD:'Maryland',ME:'Maine',MI:'Michigan',MN:'Minnesota',MO:'Missouri',MS:'Mississippi',MT:'Montana',NC:'North Carolina',ND:'North Dakota',NE:'Nebraska',NH:'New Hampshire',NJ:'New Jersey',NM:'New Mexico',NV:'Nevada',NY:'New York',OH:'Ohio',OK:'Oklahoma',OR:'Oregon',PA:'Pennsylvania',RI:'Rhode Island',SC:'South Carolina',SD:'South Dakota',TN:'Tennessee',TX:'Texas',UT:'Utah',VA:'Virginia',VT:'Vermont',WA:'Washington',WI:'Wisconsin',WV:'West Virginia',WY:'Wyoming'};

/* counting: one rule everywhere */
function after(p){return p.s==='secured'||p.s==='leading'}
function before(p){return p.pre===1}
function cnt(f){var n=0;P.forEach(function(p){if(f(p))n++});return n}
function inCh(c){return function(p){return p.c===c}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sgn(d){return d>0?'+'+d:d<0?'−'+Math.abs(d):'no change'}
function dcls(d){return d>0?'up':d<0?'dn':''}
function pct(n,c){return Math.round(100*n/D.den[c])}
function newChip(p){return p.nw&&(p.s==='secured'||p.s==='leading')?'<span class="chip new">New member</span> ':''}
function statusChip(p){
  if(p.s==='leading')return '<span class="chip o">Leading</span>';
  if(p.s==='trailing')return '<span class="chip b">Trailing</span>';
  if(p.s==='out')return '<span class="chip b">Leaving</span>';
  if(p.s==='unk')return '<span class="chip o">Result not confirmed</span>';
  return p.nw?'':'<span class="chip l">Continuing</span>';
}
function pchip(p){return '<span class="chip '+(p.p==='D'?'d':p.p==='R'?'r':'l')+'">'+esc(PARTY[p.p]||p.p)+'</span>'}
function seatTxt(p){return p.c==='G'?'Governor, '+NAMES[p.st]:p.c==='S'?'Senator, '+NAMES[p.st]:'Representative, '+p.seat}
function degTxt(p){return p.deg+(p.disc?' · '+p.disc:'')}

var TABS=[['map','Map and overview'],['new','New class'],['fields','Areas of knowledge'],['ai','AI engagement'],['roster','Roster'],['method','Method']];

/* Map and overview */
var selState=null,selArea=null;
var REG={};
'CT ME MA NH RI VT NJ NY PA'.split(' ').forEach(function(s){REG[s]='Northeast'});
'IL IN MI OH WI IA KS MN MO NE ND SD'.split(' ').forEach(function(s){REG[s]='Midwest'});
'DE FL GA MD NC SC VA WV AL KY MS TN AR LA OK TX'.split(' ').forEach(function(s){REG[s]='South'});
'AZ CO ID MT NV NM UT WY AK CA HI OR WA'.split(' ').forEach(function(s){REG[s]='West'});
var REGS=['Northeast','Midwest','South','West'];
var AREAS=['Primary care and internal medicine','Surgery and procedures','Emergency and critical care','Public health','Medicine, specialty unverified','Life sciences','Physical sciences and math','Psychology and education'];
function areaFilter(){return selArea?function(p){return p.area===selArea}:function(){return true}}
function tileGrid(f,id){
  var rows='';
  Object.keys(GRID).forEach(function(s){
    var g=GRID[s],ps=P.filter(function(p){return p.st===s&&f(p)}),a=ps.filter(after).length,l=ps.some(function(p){return p.s==='leading'&&after(p)});
    var gv=ps.some(function(p){return p.c==='G'&&after(p)});var cls='tile'+(a?' l'+Math.min(a,4):'')+(l?' lead':'')+(gv?' gov':'');
    rows+='<button class="'+cls+'" type="button" style="grid-column:'+(g[0]+1)+';grid-row:'+(g[1]+1)+'" data-s="'+s+'" aria-pressed="'+(selState===s)+'" aria-label="'+NAMES[s]+': '+a+'"><span class="ab">'+s+'</span><span class="n">'+(a||'')+'</span></button>';
  });
  return '<div class="grid" id="'+id+'">'+rows+'</div><div class="mapleg"><span><i class="sw" style="background:var(--s1)"></i>1</span><span><i class="sw" style="background:var(--s2)"></i>2</span><span><i class="sw" style="background:var(--s3)"></i>3</span><span><i class="sw" style="background:var(--s4)"></i>4</span><span><b class="gl">G</b>Includes a governor</span><span><i class="sw" style="background:var(--ochre);border-radius:50%"></i>Leading in an open race</span></div>';
}
function sciLine(p){
  if(p.com===undefined)return '';
  if(!p.com.length)return 'Committees not yet assigned';
  var sc=p.com.filter(function(c){return c.sci});
  if(!sc.length)return 'No science-funding committee seats';
  var st=sc.filter(function(c){return c.star});
  return (st.length?'<b>★ '+st.map(function(c){return esc(c.n+' ('+c.r+')')}).join('; ')+'</b>':'Science-funding committees: '+sc.slice(0,3).map(function(c){return esc(c.n)}).join('; ')+(sc.length>3?' and '+(sc.length-3)+' more':''));
}
function detail(f){
  if(!selState)return '<p class="sub" style="margin:0">Select a state to see who is there.</p>';
  var ps=P.filter(function(p){return p.st===selState&&f(p)&&after(p)});
  var h='<h3>'+NAMES[selState]+'</h3>';
  if(!ps.length)return h+'<p class="sub" style="margin:0">Nobody here in this selection.</p>';
  ps.sort(function(a,b){return a.c.localeCompare(b.c)||a.n.localeCompare(b.n)});
  ps.forEach(function(p){
    h+='<div class="pers"><div class="nm">'+esc(p.n)+' '+pchip(p)+'</div><div class="sm">'+esc(seatTxt(p))+'</div><div class="sm"><b>'+esc(p.deg)+'</b> · '+esc(p.disc)+'</div><div class="sm">Area: '+esc(p.area)+'</div>'+(sciLine(p)?'<div class="sm">'+sciLine(p)+'</div>':'')+'</div>';
  });
  return h;
}
function ALL(){return true}
var GL={Boomer:'Boomers',GenX:'Gen X',Millennial:'Millennials',Silent:'Silent generation',U:'Unknown'};
function pieSvg(cats,key){
  var tot=cats.reduce(function(s,c){return s+c.n},0),a0=-Math.PI/2,h='<svg class="pie2" viewBox="0 0 32 32" width="120" height="120" role="img">';
  cats.forEach(function(c){
    var a1=a0+2*Math.PI*c.n/tot,x0=16+16*Math.cos(a0),y0=16+16*Math.sin(a0),x1=16+16*Math.cos(a1),y1=16+16*Math.sin(a1);
    var at=' class="sl" data-pk="'+key+'" data-pv="'+c.k+'" tabindex="0" role="button" aria-label="'+c.l+', '+c.n+': show who"';
    h+=c.n===tot?'<circle'+at+' cx="16" cy="16" r="16" fill="'+c.col+'"/>':'<path'+at+' d="M16 16 L'+x0.toFixed(3)+' '+y0.toFixed(3)+' A16 16 0 '+(c.n/tot>0.5?1:0)+' 1 '+x1.toFixed(3)+' '+y1.toFixed(3)+' Z" fill="'+c.col+'" stroke="var(--bg)" stroke-width="0.4"/>';
    a0=a1;
  });
  return h+'</svg>';
}
function pieRow(title,cats,key){
  var leg=cats.map(function(c){return '<button type="button" class="sl" data-pk="'+key+'" data-pv="'+c.k+'"><i class="dot2" style="background:'+c.col+'"></i>'+c.l+' <b data-k="'+key+'-'+c.k+'">'+c.n+'</b></button>'}).join('');
  return '<div class="pcard"><h3>'+title+'</h3>'+pieSvg(cats,key)+'<div class="pleg">'+leg+'</div></div>';
}
var selSlice=null;
var SLF={dp:function(v){return function(p){return p.p===v}},dg:function(v){return function(p){return p.g===v}},dn:function(v){return function(p){return (p.gen||'U')===v}}};
var SLN={dp:{D:'Democrats',R:'Republicans'},dg:{F:'Women',M:'Men'},dn:GL};
function sliceInfo(){
  if(!selSlice)return '<p class="sub" style="margin:0">Select a slice to see who is in it.</p>';
  var f=SLF[selSlice.k](selSlice.v),ps=P.filter(function(p){return after(p)&&f(p)}).sort(function(a,b){return a.c.localeCompare(b.c)||a.n.localeCompare(b.n)});
  return '<h3>'+SLN[selSlice.k][selSlice.v]+' ('+ps.length+')</h3>'+ps.map(function(p){return '<div class="pers"><div class="nm">'+esc(p.n)+' '+pchip(p)+'</div><div class="sm">'+esc(seatTxt(p))+(p.by?' · born '+p.by:'')+'</div><div class="sm"><b>'+esc(p.deg)+'</b> · '+esc(p.disc)+'</div></div>'}).join('');
}
function setSlice(k,v){
  selSlice=(selSlice&&selSlice.k===k&&selSlice.v===v)?null:{k:k,v:v};

}
function demo(){
  var A=P.filter(after),n=function(f){return A.filter(f).length};
  var h='<div class="sec"><h3>Who they are</h3><div class="pies">';
  h+=pieRow('Party',[{k:'D',l:'Democrats',n:n(function(p){return p.p==='D'}),col:'var(--dem)'},{k:'R',l:'Republicans',n:n(function(p){return p.p==='R'}),col:'var(--rep)'}],'dp');
  h+=pieRow('Gender',[{k:'F',l:'Women',n:n(function(p){return p.g==='F'}),col:'var(--c2)'},{k:'M',l:'Men',n:n(function(p){return p.g==='M'}),col:'var(--c1)'}],'dg');
  var gc=[['Boomer','var(--c1)'],['GenX','var(--c2)'],['Millennial','var(--c3)'],['Silent','var(--c5)'],['U','var(--line-strong)']];
  h+=pieRow('Generation',gc.map(function(x){return {k:x[0],l:GL[x[0]],col:x[1],n:n(function(p){return (p.gen||'U')===x[0]})}}).filter(function(c){return c.n}),'dn');
  return h+'</div><div class="detail" id="sliceinfo" style="margin-top:12px">'+sliceInfo()+'</div><p class="sub" style="margin-top:10px">After the election, leaders included. Generation by birth year (Boomer 1946–64, Gen X 1965–80, Millennial 1981–96). Hamawy and Shah are placed from published ages; Cowan’s birth year was not found.</p></div>';
}
function mapView(){
  return '<div class="callout" style="margin-bottom:14px"><b>This is everyone, not just the new class.</b> The map, table and charts on this tab cover every member with a PhD or MD after the election, including those re-elected. The New class tab shows only the new members.</div>'+'<div class="sec" style="margin-top:0"><div class="mapwrap"><div>'+tileGrid(ALL,'grid')+'</div><div class="detail" id="detail">'+detail(ALL)+'</div></div></div>'+overview()+demo();
}


/* Overview */
function overview(){
  var DT=D.den.S+D.den.H+D.den.G;
  var rows=[['tot','All three bodies',function(p){return true},DT]].concat(['S','H','G'].map(function(c){return [c,CH[c],inCh(c),D.den[c]]}));
  var h='<div class="sec"><h3>Before and after midterm</h3><table class="mx ov"><thead><tr><th></th><th>Before</th><th>After</th><th>Change</th><th>Share of body</th></tr></thead><tbody>';
  rows.forEach(function(r){
    var b=cnt(function(p){return r[2](p)&&before(p)}),a=cnt(function(p){return r[2](p)&&after(p)}),l=cnt(function(p){return r[2](p)&&p.s==='leading'});
    var sh=Math.round(100*a/r[3]);
    h+='<tr><th scope="row">'+r[1]+'</th><td data-k="'+r[0]+'-before">'+b+'</td><td data-k="'+r[0]+'-after"><b>'+a+'</b></td><td><span class="delta '+dcls(a-b)+'">'+sgn(a-b)+'</span></td><td>'+sh+'%</td></tr>';
  });
  h+='</tbody></table>';
  h+='<p class="sub" style="margin-top:10px">Before: people with a PhD or MD holding a seat before the election. After: those who will hold one, counting leaders in uncalled races. Change is net, so a departure and an arrival can cancel out.</p><ul class="m">';
  ['S','H','G'].forEach(function(c){
    var out=P.filter(function(p){return p.c===c&&before(p)&&!after(p)}),inn=P.filter(function(p){return p.c===c&&after(p)&&!before(p)});
    var lab=function(a){return a.length?a.map(function(p){return esc(p.n)+' ('+p.p+')'}).join(', '):'none'};
    h+='<li><b>'+CH[c]+':</b> leaving or trailing '+lab(out)+'; joining '+lab(inn)+'.</li>';
  });
  return h+'</ul></div>';
}

/* New class */
function newView(){

    var c=x[0],n=cnt(function(p){return p.c===c&&p.nw&&after(p)}),l=cnt(function(p){return p.c===c&&p.nw&&p.s==='leading'});

  });

  h+='<div class="sec"><h3>Leaving</h3>'+list(P.filter(function(p){return before(p)&&!after(p)}),true)+'</div>';

}
function list(ps,notes){
  var o={S:0,H:1,G:2};
  ps.sort(function(a,b){return o[a.c]-o[b.c]||a.n.localeCompare(b.n)});
  return '<div class="panelbox">'+ps.map(function(p){
    return '<div class="pers"><div class="nm">'+esc(p.n)+' '+pchip(p)+' '+newChip(p)+statusChip(p)+'</div><div class="sm">'+esc(seatTxt(p))+' · '+esc(degTxt(p))+'</div>'+(notes&&p.note?'<div class="nt">'+esc(p.note)+'</div>':'')+'</div>';
  }).join('')+'</div>';
}

/* Fields */
function fieldsView(){
  var f=areaFilter(),A=P.filter(after);
  var h='<div class="head"><h2>Areas of knowledge</h2></div><div class="areas"><button type="button" class="ab2" data-a="" aria-pressed="'+(!selArea)+'">All <b>'+A.length+'</b></button>';
  AREAS.forEach(function(a){var n=A.filter(function(p){return p.area===a}).length;if(n)h+='<button type="button" class="ab2" data-a="'+esc(a)+'" aria-pressed="'+(selArea===a)+'">'+esc(a)+' <b data-k="ar-'+esc(a)+'">'+n+'</b></button>'});
  h+='</div><div class="mapwrap"><div>'+tileGrid(f,'fgrid')+'</div><div class="detail" id="detail">'+areaDetail(f)+'</div></div>';
  h+='<div class="sec"><h3>By region</h3><table class="mx"><thead><tr><th></th>'+REGS.map(function(r){return '<th>'+r+'</th>'}).join('')+'<th>All</th></tr></thead><tbody>';
  var mx=0;AREAS.forEach(function(a){REGS.forEach(function(r){var c=A.filter(function(p){return p.area===a&&REG[p.st]===r}).length;if(c>mx)mx=c})});
  AREAS.forEach(function(a){
    var tot=A.filter(function(p){return p.area===a}).length;if(!tot)return;
    h+='<tr data-a="'+esc(a)+'"'+(selArea===a?' class="sel"':'')+'><th scope="row">'+esc(a)+'</th>';
    REGS.forEach(function(r){var c=A.filter(function(p){return p.area===a&&REG[p.st]===r}).length;
      h+='<td data-k="mx-'+esc(a)+'-'+r+'" style="background:'+(c?'color-mix(in srgb,var(--moss) '+Math.round(18+62*c/mx)+'%,transparent)':'transparent')+'">'+(c||'')+'</td>'});
    h+='<td><b>'+tot+'</b></td></tr>';
  });
  var rt=REGS.map(function(r){return A.filter(function(p){return REG[p.st]===r}).length});
  h+='<tr><th scope="row">All</th>'+rt.map(function(c,i){return '<td data-k="rg-'+REGS[i]+'"><b>'+c+'</b></td>'}).join('')+'<td><b>'+A.length+'</b></td></tr></tbody></table><p class="sub" style="margin-top:8px">Census regions. Select an area above or a row to filter the map.</p></div>';
  return h;
}
function areaDetail(f){
  if(selState)return detail(f);
  var A=P.filter(function(p){return after(p)&&f(p)}),dc={};
  A.forEach(function(p){dc[p.disc]=(dc[p.disc]||0)+1});
  var h='<h3>'+(selArea||'All areas')+'</h3><div class="chips">'+Object.keys(dc).sort(function(x,y){return dc[y]-dc[x]||x.localeCompare(y)}).map(function(k){return '<span class="chip">'+esc(k)+(dc[k]>1?' '+dc[k]:'')+'</span>'}).join('')+'</div><p class="sub" style="margin-top:10px">Select a state to see who is there.</p>';
  return h;
}


/* Roster */
var q='',sortBy='chamber';
function rosterView(){
  return '<div class="head"><h2>Roster</h2></div><div class="tools"><input type="search" id="q" placeholder="Search name, state or field" value="'+esc(q)+'" aria-label="Search the roster"><select id="sortsel" aria-label="Sort"><option value="chamber"'+(sortBy==='chamber'?' selected':'')+'>Grouped by chamber, sorted by name</option><option value="senior"'+(sortBy==='senior'?' selected':'')+'>Grouped by chamber, longest in office first</option></select></div><p class="sub">★ chairs, vice chairs and ranking members of science-funding committees (appropriations, science, health, energy and commerce, agricultural research). Committees are the current Congress; new members are not yet assigned.</p><div id="rows">'+rows()+'</div>';
}
function body(p){
  var h='';
  if(p.com!==undefined){
    h+='<div class="kv"><b>Profile</b> '+(p.g==='F'?'Woman':'Man')+(p.by?', born '+p.by:'')+(p.gen?' ('+GL[p.gen]+')':'')+'</div>';
    h+='<div class="kv"><b>Seniority</b> '+(p.cs?'In current office since '+p.cs:'Incoming, not yet sworn in')+(p.fo?' · first elected office '+p.fo:'')+'</div>';
    if(p.com.length){h+='<div class="kv"><b>Committees</b><ul class="m">'+p.com.map(function(c){return '<li>'+(c.star?'<b>★ ':'')+esc(c.n)+' — '+esc(c.r)+(c.star?'</b>':'')+(c.sci&&!c.star?' <span class="chip o">science</span>':'')+'</li>'}).join('')+'</ul></div>'}
    else h+='<div class="kv"><b>Committees</b> Not yet assigned.'+(p.pc&&p.pc.length?' Earlier: '+p.pc.slice(0,4).map(function(c){return esc(c.n+' ('+c.b+(c.r?', '+c.r:'')+')')}).join('; ')+'.':'')+'</div>';
    h+=aiBlock(p);
  }
  if(p.note)h+='<div class="kv">'+esc(p.note)+'</div>';
  h+='<div class="kv">'+(p.src||[]).map(function(u,i){return '<a href="'+esc(u)+'" target="_blank" rel="noopener">Source '+(i+1)+'</a>'}).join(' · ')+'</div>';
  return h;
}
function aiBlock(p){
  var h='<div class="kv"><b>AI evidence</b> '+esc(p.aw||'')+(p.pubn?' <span class="sm">Publications: '+esc(p.pubn)+'.</span>':'')+(p.ev&&p.ev.length?'<ul class="m">'+p.ev.map(function(e){return '<li>'+(e.u?'<a href="'+esc(e.u)+'" target="_blank" rel="noopener">'+(e.c?'★ ':'')+esc(e.t)+'</a>':esc(e.t))+(e.d?' <span class="sm">('+esc(e.d)+')</span>':'')+'</li>'}).join('')+'</ul>':'')+'</div>';
  return h;
}
function starred(p){return (p.com||[]).some(function(c){return c.star})}
function rowHtml(p){
  return '<details class="row"><summary><span><span class="nm">'+(starred(p)?'★ ':'')+esc(p.n)+'</span> '+pchip(p)+'<div class="sm">'+esc(seatTxt(p))+(p.cs?' · since '+p.cs:'')+'</div></span><span class="sm sm2">'+esc(degTxt(p))+'</span>'+newChip(p)+statusChip(p)+'</summary><div class="body">'+body(p)+'</div></details>';
}
function swRowHtml(p){
  var sci=[p.sd,p.swk].filter(Boolean).join(' · ');
  return '<details class="row"><summary><span><span class="nm">'+esc(p.n)+'</span> '+pchip(p)+'<div class="sm">'+esc(seatTxt(p))+'</div></span><span class="sm sm2">'+esc(p.sd||p.swk)+'</span>'+statusChip(p)+'</summary><div class="body"><div class="kv"><b>Science background</b> '+esc(sci)+' ('+({degree:'education',work:'work experience',both:'education and work'})[p.basis]+')</div><div class="kv">'+esc(p.nt||'')+'</div><div class="kv"><a href="'+esc(p.eu)+'" target="_blank" rel="noopener">Source for background</a>'+(p.su?' · <a href="'+esc(p.su)+'" target="_blank" rel="noopener">Source for status</a>':'')+'</div></div></details>';
}
function grouped(ps,fn,sorter){
  var h='';[['S','Senate'],['H','House'],['G','Governors']].forEach(function(c){
    var g=ps.filter(function(p){return p.c===c[0]}).sort(sorter);
    if(g.length)h+='<h3 class="rg">'+c[1]+' <span class="sm">'+g.length+'</span></h3>'+g.map(fn).join('');
  });
  return h;
}
function rows(){
  var t=q.toLowerCase();
  function hit(p){return !t||(p.n+' '+p.st+' '+NAMES[p.st]+' '+(p.disc||'')+' '+(p.f||'')+' '+(p.sd||'')+' '+(p.swk||'')).toLowerCase().indexOf(t)>-1}
  var ps=P.filter(hit),xs=(D.sw||[]).filter(hit);
  var srt=sortBy==='senior'?function(a,b){return (a.cs||9999)-(b.cs||9999)||a.n.localeCompare(b.n)}:function(a,b){return a.n.localeCompare(b.n)};
  if(!ps.length&&!xs.length)return '<p class="sub">No match.</p>';
  var h=grouped(ps,rowHtml,srt);
  if(xs.length)h+='<div class="rsec"><h2 class="rh">Also with a science background, no MD or PhD</h2><p class="sub">Members of the incoming Congress and governors with a degree or career in natural science, math, computer science or engineering. '+xs.length+' people. Not exhaustive: '+(D.swUnclear||0)+' other members could not be checked because their bachelor’s field is not stated in the sources I could open.</p>'+grouped(xs,swRowHtml,function(a,b){return a.n.localeCompare(b.n)})+'</div>';
  return h;
}


/* Method */
function methodView(){
  var nc=D.notCounted;
  return '<div class="head"><h2>Method</h2></div>'+
  '<ul class="m"><li>Counted: a PhD or an MD (or DO). Other doctorates are not counted.</li>'+
  '<li>Social and behavioral PhDs count only for psychology, neuroscience and education. Political science, public policy and similar do not.</li>'+
  '<li>“After” is called winners plus candidates leading an uncalled race, marked leading. No race is treated as won until called.</li>'+
  '<li>Demographics, committees and AI evidence cover the people counted after the election. Birth years, committees and statements come from official pages, Wikipedia, news and committee aggregators, and were checked twice, with corrections. Focus tags come from the items listed for each person and were assigned by reading them: one main focus and up to two secondary, only where an item supports it. Evidence is split into policy actions (bills introduced or cosponsored, official letters, formal roles such as chairing a hearing or co-chairing a caucus, signed laws) and public comments (speeches, hearing remarks, interviews, op-eds, statements); that split is my judgment. The bottom of the Roster lists members with a science background but no MD or PhD. A sweep checked each sitting member’s Wikipedia biography for a degree or career in natural science, math, computer science or engineering. Where the bachelor’s field was not stated I left the person out, so the list is not exhaustive. Status labelled “Result not confirmed” means I could not find a 2026 result or call. Several biographies of the non-PhD/MD members on the AI tab rely on Wikipedia alone, and Beyer’s master’s is in progress. Mace’s 8 or 9 and Lummis’s 1.5 come from one informal Fox News piece (Apr 20, 2023), not a formal survey. Several committee lists rely on aggregators because house.gov was blocked to me. Committee lists are the current Congress, so new members have none.</li><li>The count of new House members (about 99) is a pre-election projection from <a href="https://www.kylehousegroup.com/insights/120th-congress-freshman-class" target="_blank" rel="noopener">Kyle House Group</a>, dated Oct 30, 2026. I could not find a post-election total.</li><li>Degrees come from official biographies, university pages and Wikipedia. Status comes from news tallies as of '+esc(D.asof)+'.</li></ul>'+
  '<div class="callout">Results can still change. Several winners rest on a single tally, so check the roster sources before quoting a specific name.</div>'+
  '<div class="sec"><h3>Not counted</h3><div class="chips">'+nc.map(function(x){return '<span class="chip l" title="'+esc(x.why)+'">'+esc(x.n)+' · '+esc(x.why)+'</span>'}).join('')+'</div></div>';
}

var AIW={H:'Higher',M:'Moderate',L:'Lower'};
function evBlock(p){
  var all=(p.ev||[]).filter(function(e){return e.u&&e.c});
  if(!all.length)return '<div class="sm">No starred evidence found.</div>';
  var pol=all.filter(function(e){return e.cat==='P'}),com=all.filter(function(e){return e.cat!=='P'});
  function items(arr){return arr.map(function(e){return '<div class="nt"><a href="'+esc(e.u)+'" target="_blank" rel="noopener">'+esc(e.t)+'</a>'+(e.d?' <span class="sm">('+esc(e.d)+')</span>':'')+'</div>'}).join('')}
  var h='';
  if(pol.length)h+='<div class="evg"><span class="chip act">Policy action</span>'+items(pol)+'</div>';
  else h+='<div class="sm evnone">No policy action found.</div>';
  if(com.length)h+='<details class="evd"><summary>'+com.length+' public comment'+(com.length>1?'s':'')+'</summary><div class="evg"><span class="chip cmt">Public comment</span>'+items(com)+'</div></details>';
  return h;
}
var FOC=[['framework','Federal frameworks and standards'],['frontier','Frontier model safety'],['kids','Kids and chatbots'],['elections','Elections and deepfakes'],['privacy','Privacy and state rules'],['china','China and chips'],['datacenters','Data centers and energy'],['health','Health and biology'],['jobs','Jobs and workforce'],['finance','Finance'],['government','Government and defense']];
var FOCN={};FOC.forEach(function(f){FOCN[f[0]]=f[1]});
var aiGroup='tier',aiFocus='',aiDeg='';
function aiScore(p){return p.fp+(p.ar||0)}
function aiCard(p){
  var fx=(p.fx||[]).map(function(k,i){return '<span class="chip fchip'+(i?' sec':'')+'">'+esc(FOCN[k])+'</span>'}).join(' ');
  return '<div class="pers'+(p.nw&&p.s!=='out'?' isnew':'')+'"><div class="nm">'+esc(p.n)+' '+newChip(p)+pchip(p)+' '+statusChip(p)+(p.edu?' <span class="chip l">No PhD or MD</span>':'')+'</div><div class="sm">'+esc(seatTxt(p))+' · '+esc(p.edu?p.deg:degTxt(p))+'</div>'+(p.edu&&p.sn&&p.s!=='secured'?'<div class="sm">'+(p.su?'<a href="'+esc(p.su)+'" target="_blank" rel="noopener">'+esc(p.sn)+'</a>':esc(p.sn))+'</div>':'')+evBlock(p)+'</div>';
}
function aiGroups(ps){
  var out=[];
  if(aiGroup==='focus'){FOC.forEach(function(f){out.push([f[1],ps.filter(function(p){return p.fx&&p.fx[0]===f[0]})])});out.push(['No clear focus found',ps.filter(function(p){return !p.fx||!p.fx.length})])}
  else if(aiGroup==='party')['D','R','I'].forEach(function(k){out.push([PARTY[k],ps.filter(function(p){return p.p===k})])});
  else if(aiGroup==='chamber')['S','H','G'].forEach(function(k){out.push([CH[k],ps.filter(function(p){return p.c===k})])});
  else if(aiGroup==='status')out.push(['New members',ps.filter(function(p){return p.nw&&p.s!=='out'})],['Continuing',ps.filter(function(p){return !p.nw&&p.s!=='out'})],['Leaving or trailing',ps.filter(function(p){return p.s==='out'||p.s==='trailing'})]);
  else['H','M','L'].forEach(function(k){out.push([AIW[k],ps.filter(function(p){return p.ai===k})])});
  return out.filter(function(g){return g[1].length});
}
function aiView(){
  var all=P.filter(after).concat(D.xt||[]);
  var ps=all.filter(function(p){return (!aiFocus||(p.fx||[]).indexOf(aiFocus)>-1)&&(!aiDeg||(aiDeg==='x'?!!p.edu:!p.edu))});
  var g={H:0,M:0,L:0};ps.forEach(function(p){g[p.ai]++});
  var h='<div class="head"><h2>AI engagement</h2></div><div class="callout">A rough guess, not an assessment of anyone. Engagement combines how likely someone is to understand AI and what they have done about it. People are grouped by their training and by the evidence of AI work I found. Policy actions are shown; public comments are tucked under each person. <b>Policy action</b> means bills introduced or cosponsored, official letters, formal roles and signed laws. <b>Public comment</b> means speeches, hearing remarks, interviews, op-eds and statements. This is the only tab that goes beyond PhD and MD holders: it also lists '+(D.xt||[]).length+' members with other degrees (tagged “No PhD or MD”), a hand-picked set that is not a ranking of Congress. New members carry a gold tag. “Nothing found” is not “nothing exists”. More on the Method tab.</div><div class="stats">';
  ['H','M','L'].forEach(function(k){h+='<div class="stat'+(k==='M'?' o':k==='L'?' b':'')+'"><div><div class="big" data-k="ai-'+k+'">'+g[k]+'</div><div class="lab">'+AIW[k]+' engagement</div></div></div>'});
  h+='</div><div class="aictl"><label>Group by <select id="aigroup">'+[['tier','Engagement level'],['focus','Main focus'],['party','Party'],['chamber','Chamber'],['status','New or continuing']].map(function(o){return '<option value="'+o[0]+'"'+(aiGroup===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></label> <label>Show <select id="aideg">'+[['','Everyone'],['m','PhD or MD'],['x','Other degrees']].map(function(o){return '<option value="'+o[0]+'"'+(aiDeg===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></label> <button class="evbtn" id="evall" type="button">Expand all public comments</button></div>';
  h+='<div class="fxbar" role="group" aria-label="Filter by focus"><button type="button" class="fxb'+(aiFocus?'':' on')+'" data-f="">All focuses</button>'+FOC.map(function(f){var n=all.filter(function(p){return (p.fx||[]).indexOf(f[0])>-1}).length;return '<button type="button" class="fxb'+(aiFocus===f[0]?' on':'')+'" data-f="'+f[0]+'" aria-pressed="'+(aiFocus===f[0])+'">'+esc(f[1])+' <span class="sm">'+n+'</span></button>'}).join('')+'</div>';
  if(aiFocus)h+='<p class="sm">Showing people whose main or secondary focus is “'+esc(FOCN[aiFocus])+'”: '+ps.length+'.</p>';
  var gs=aiGroups(ps);
  if(!gs.length)h+='<p>No one matches these filters.</p>';
  gs.forEach(function(x){
    h+='<div class="sec"><h3>'+esc(x[0])+' <span class="sm">'+x[1].length+'</span></h3><div class="panelbox">'+x[1].sort(function(a,b){return aiScore(b)-aiScore(a)||a.n.localeCompare(b.n)}).map(aiCard).join('')+'</div></div>';
  });
  return h;
}

var VIEWS={ai:aiView,map:mapView,new:newView,fields:fieldsView,roster:rosterView,method:methodView};
var cur='map';
function render(){
  document.getElementById('main').innerHTML='<section class="panel on" id="p-'+cur+'">'+VIEWS[cur]()+'</section>';
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(b){b.setAttribute('aria-selected',b.dataset.t===cur)});
}
function go(t){selSlice=null;if(t==='overview')t='map';cur=VIEWS[t]?t:'map';selState=null;if(location.hash!=='#'+cur)history.replaceState(null,'','#'+cur);render()}

document.getElementById('tabs').innerHTML=TABS.map(function(t){return '<button role="tab" type="button" data-t="'+t[0]+'">'+t[1]+'</button>'}).join('');
document.getElementById('tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(b)go(b.dataset.t)});
document.getElementById('main').addEventListener('click',function(e){
  var fb=e.target.closest('.fxb');if(fb){aiFocus=fb.dataset.f;var y=window.scrollY;render();window.scrollTo(0,y);return}
  if(e.target.id==='evall'){var ds=document.querySelectorAll('.evd'),open=e.target.dataset.o!=='1';Array.prototype.forEach.call(ds,function(x){x.open=open});e.target.dataset.o=open?'1':'0';e.target.textContent=open?'Collapse all public comments':'Expand all public comments';return}
  var t=e.target.closest('.tile');if(t){selState=selState===t.dataset.s?null:t.dataset.s;var g=t.parentNode;Array.prototype.forEach.call(g.children,function(c){c.setAttribute('aria-pressed',c.dataset.s===selState)});document.getElementById('detail').innerHTML=cur==='fields'?areaDetail(areaFilter()):detail(ALL);return}
  var sl=e.target.closest('.sl');if(sl){setSlice(sl.dataset.pk,sl.dataset.pv);return}
  var a=e.target.closest('[data-a]');if(a){selArea=a.dataset.a||null;selState=null;render()}
});
document.getElementById('main').addEventListener('input',function(e){if(e.target.id==='q'){q=e.target.value;document.getElementById('rows').innerHTML=rows()}});
document.getElementById('main').addEventListener('change',function(e){if(e.target.id==='aigroup'||e.target.id==='aideg'){if(e.target.id==='aigroup')aiGroup=e.target.value;else aiDeg=e.target.value;var y=window.scrollY;render();window.scrollTo(0,y);return}if(e.target.id==='sortsel'){sortBy=e.target.value;document.getElementById('rows').innerHTML=rows()}});
document.getElementById('main').addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('sl')&&e.target.tagName!=='BUTTON'){e.preventDefault();setSlice(e.target.dataset.pk,e.target.dataset.pv)}});
window.addEventListener('hashchange',function(){go(location.hash.slice(1))});

/* theme */
var root=document.documentElement,tb=document.getElementById('theme');
function isDark(){var a=root.getAttribute('data-theme');return a?a==='dark':matchMedia('(prefers-color-scheme:dark)').matches}
function setBtn(){tb.textContent=isDark()?'Light mode':'Dark mode'}
tb.addEventListener('click',function(){root.setAttribute('data-theme',isDark()?'light':'dark');setBtn()});
setBtn();

document.getElementById('foot').textContent='Counts as of '+D.asof+'. Open races can still change.';
go(location.hash.slice(1)||'map');
})();
</script>
</body>
</html>
