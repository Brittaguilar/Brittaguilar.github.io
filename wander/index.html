<title>Wander — Discover the web</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --ink:#0f0f13; --ink2:#1a1a22; --ink3:#252530;
  --paper:#f2efe8; --paper2:#ccc8bf;
  --spark:#e8533a; --spark2:#f0956e;
  --violet:#8b5cf6; --violet-dim:rgba(139,92,246,0.18);
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.12);
}

html, body { min-height:100vh; background:var(--ink); color:var(--paper); font-family:'DM Sans',sans-serif; }

nav {
  position:sticky; top:0; z-index:200;
  background:rgba(15,15,19,0.92); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:20px; padding:0 28px; height:60px;
}
.logo { font-family:'DM Serif Display',serif; font-size:22px; color:var(--paper); letter-spacing:-0.5px; display:flex; align-items:center; gap:8px; flex-shrink:0; user-select:none; }
.logo-pip { width:7px; height:7px; background:var(--spark); border-radius:50%; animation:breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 0%,100%{transform:scale(1);opacity:1;} 50%{transform:scale(1.5);opacity:0.6;} }

.nav-filters { display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; flex:1; }
.nav-filters::-webkit-scrollbar { display:none; }
.pill { font-size:12px; font-weight:500; padding:5px 14px; border-radius:99px; border:1px solid var(--border2); background:transparent; color:var(--paper2); cursor:pointer; white-space:nowrap; transition:background 0.15s,color 0.15s,border-color 0.15s; font-family:'DM Sans',sans-serif; }
.pill:hover { color:var(--paper); border-color:rgba(255,255,255,0.28); }
.pill.active { background:var(--spark); border-color:var(--spark); color:#fff; }

.wander-btn { font-family:'DM Mono',monospace; font-size:13px; font-weight:500; padding:9px 20px; border-radius:7px; border:none; background:var(--spark); color:#fff; cursor:pointer; display:flex; align-items:center; gap:8px; transition:background 0.15s,transform 0.1s; white-space:nowrap; flex-shrink:0; }
.wander-btn:hover { background:#d9442c; }
.wander-btn:active { transform:scale(0.97); }
.wander-btn .kbd { font-size:10px; opacity:0.6; background:rgba(0,0,0,0.2); padding:1px 5px; border-radius:3px; }

/* Single-site hero */
#hero-section { display:none; padding:40px 28px 20px; max-width:1100px; margin:0 auto; }
#hero-section.visible { display:block; }
#hero-card {
  background:var(--ink2); border:1px solid var(--border2); border-radius:16px; overflow:hidden;
  display:grid; grid-template-columns:1.5fr 1fr; min-height:440px;
  box-shadow:0 20px 60px rgba(0,0,0,0.35);
}
.hero-shot { position:relative; background:var(--ink3); overflow:hidden; min-height:360px; cursor:pointer; }
.hero-shot img { width:100%; height:100%; object-fit:cover; object-position:top; display:block; transition:transform 0.5s ease; }
.hero-shot:hover img { transform:scale(1.03); }
.spinner { width:34px; height:34px; border:3px solid rgba(255,255,255,0.1); border-top-color:var(--spark); border-radius:50%; animation:spin 0.7s linear infinite; }

.hero-info { padding:40px 40px 36px; display:flex; flex-direction:column; border-left:1px solid var(--border); }
.hero-eyebrow { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--spark2); margin-bottom:20px; }
.hero-tags { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
.hero-tags .tag { font-size:11px; font-weight:500; padding:3px 11px; border-radius:99px; background:var(--violet-dim); color:#c4b5fd; border:1px solid rgba(139,92,246,0.25); font-family:'DM Mono',monospace; }
.hero-title { font-family:'DM Serif Display',serif; font-size:38px; line-height:1.1; color:var(--paper); margin-bottom:14px; letter-spacing:-0.5px; }
.hero-desc { font-size:16px; line-height:1.65; color:var(--paper2); flex:1; }
.hero-url { font-family:'DM Mono',monospace; font-size:12px; color:rgba(255,255,255,0.28); margin:24px 0 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hero-actions { margin-top:22px; display:flex; gap:10px; }
.btn-visit { flex:1; padding:13px 20px; background:var(--spark); color:#fff; border:none; border-radius:8px; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; cursor:pointer; text-decoration:none; display:flex; align-items:center; justify-content:center; gap:6px; transition:background 0.15s; }
.btn-visit:hover { background:#d9442c; }
.btn-next { padding:13px 18px; background:var(--ink3); color:var(--paper); border:1px solid var(--border2); border-radius:8px; font-family:'DM Mono',monospace; font-size:13px; cursor:pointer; transition:border-color 0.15s,background 0.15s; white-space:nowrap; }
.btn-next:hover { border-color:rgba(255,255,255,0.35); background:#2e2e3a; }
.hero-browse { margin-top:16px; background:none; border:none; color:rgba(255,255,255,0.3); font-family:'DM Mono',monospace; font-size:12px; cursor:pointer; padding:0; text-align:left; transition:color 0.15s; }
.hero-browse:hover { color:var(--paper2); }

/* Grid */
#grid-section { padding:28px 28px 20px; display:none; }
.grid-label { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,0.25); margin-bottom:16px; display:flex; align-items:center; gap:10px; }
.grid-label span { color:var(--paper2); }
#site-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; }

.site-card { position:relative; background:var(--ink2); border:1px solid var(--border); border-radius:10px; overflow:hidden; cursor:pointer; transition:border-color 0.18s,transform 0.18s; text-decoration:none; display:flex; flex-direction:column; }
.site-card:hover { border-color:rgba(255,255,255,0.2); transform:translateY(-2px); }

.card-thumb { width:100%; aspect-ratio:16/9; background:var(--ink3); overflow:hidden; position:relative; flex-shrink:0; }
.card-thumb img { width:100%; height:100%; object-fit:cover; object-position:top; display:block; transition:transform 0.35s ease; }
.site-card:hover .card-thumb img { transform:scale(1.04); }
.thumb-placeholder { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.mini-spin { width:20px; height:20px; border:2px solid rgba(255,255,255,0.08); border-top-color:var(--spark); border-radius:50%; animation:spin 0.7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

.card-body { padding:12px 14px 14px; flex:1; display:flex; flex-direction:column; gap:5px; }
.card-title { font-size:13px; font-weight:600; color:var(--paper); line-height:1.3; }
.card-desc { font-size:12px; color:var(--paper2); line-height:1.5; flex:1; }
.card-meta { display:flex; align-items:center; gap:6px; margin-top:6px; }
.card-favicon { width:14px; height:14px; border-radius:2px; flex-shrink:0; }
.card-domain { font-family:'DM Mono',monospace; font-size:10px; color:rgba(255,255,255,0.22); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.card-tag { margin-left:auto; font-size:10px; padding:2px 7px; border-radius:99px; background:var(--violet-dim); color:#c4b5fd; border:1px solid rgba(139,92,246,0.2); font-family:'DM Mono',monospace; flex-shrink:0; }

#splash-state { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:calc(100vh - 60px); gap:20px; text-align:center; padding:40px; }
.splash-heading { font-family:'DM Serif Display',serif; font-size:clamp(40px,7vw,76px); line-height:1; letter-spacing:-1.5px; color:var(--paper); }
.splash-heading em { font-style:italic; color:var(--spark2); }
.splash-sub { font-size:16px; color:var(--paper2); max-width:400px; line-height:1.6; }
.splash-cta { font-family:'DM Mono',monospace; font-size:14px; font-weight:500; padding:13px 32px; border-radius:8px; border:none; background:var(--spark); color:#fff; cursor:pointer; transition:background 0.15s,transform 0.1s; display:flex; align-items:center; gap:10px; }
.splash-cta:hover { background:#d9442c; }
.splash-hint { font-family:'DM Mono',monospace; font-size:11px; color:rgba(255,255,255,0.2); }

#load-more-wrap { display:none; justify-content:center; padding:8px 0 48px; }
#load-more-wrap.visible { display:flex; }
.load-more-btn { font-family:'DM Mono',monospace; font-size:12px; padding:10px 28px; border-radius:7px; border:1px solid var(--border2); background:transparent; color:var(--paper2); cursor:pointer; transition:border-color 0.15s,color 0.15s; }
.load-more-btn:hover { border-color:rgba(255,255,255,0.3); color:var(--paper); }

@media (max-width:720px) {
  nav { padding:0 16px; gap:12px; }
  #grid-section { padding-left:16px; padding-right:16px; }
  #site-grid { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  #hero-section { padding:20px 16px; }
  #hero-card { grid-template-columns:1fr; min-height:0; }
  .hero-shot { min-height:220px; }
  .hero-info { border-left:none; border-top:1px solid var(--border); padding:28px 24px 28px; }
  .hero-title { font-size:28px; }
}
</style>
</head>

// ── Screenshot via WordPress mShots (free, no key, works on hosted sites) ──
function shotUrl(url, w) {
  return `https://s0.wp.com/mshots/v1/${encodeURIComponent(url)}?w=${w}&h=${Math.round(w*0.625)}`;
}
function domain(url) { try { return new URL(url).hostname.replace('www.',''); } catch(e) { return url; } }
function faviconUrl(url) { try { return `https://www.google.com/s2/favicons?domain=${new URL(url).origin}&sz=32`; } catch(e) { return ''; } }

/*
  SCREENSHOT POLICY — attempt screenshots everywhere, fall back to a designed
  gradient card on failure.

  Every site tries for a real mShots screenshot. The retry loop waits out the grey
  "generating" placeholder, and if the shot errors or never resolves we render the
  generated gradient card (layered mesh + pattern + initials) — which is designed
  to look intentional, not like a broken image.

  The one case we can't auto-detect is a site that returns a full-size "you have
  been blocked" / verification page (it looks identical to a real screenshot from
  JavaScript's side). For those, add  noShot:true  to the site's entry in SITES and
  it will skip the screenshot and show the gradient instead. The list below is
  seeded with sites already confirmed to serve block pages.
*/
function loadShot(container, site, width, isHero) {
  if (site.noShot) { showFallback(container, site); return; }

  container.innerHTML = `<div class="thumb-placeholder"><div class="${isHero ? 'spinner' : 'mini-spin'}"></div></div>`;

  let attempts = 0;
  const maxAttempts = 5;
  const src = shotUrl(site.url, width);

  function tryLoad() {
    attempts++;
    const img = new Image();
    img.onload = () => {
      // mShots placeholder is small & fixed-size. Real captures are wider.
      if (img.naturalWidth <= 400) {
        if (attempts < maxAttempts) { setTimeout(tryLoad, 1600); return; }
        showFallback(container, site);
        return;
      }
      container.innerHTML = '';
      img.style.cssText = 'width:100%;height:100%;object-fit:cover;object-position:top;';
      container.appendChild(img);
    };
    img.onerror = () => {
      if (attempts < maxAttempts) { setTimeout(tryLoad, 1600); }
      else { showFallback(container, site); }
    };
    img.src = attempts === 1 ? src : src + '&retry=' + attempts;
  }
  tryLoad();
}

// ── Generated themed fallback card ──
// Each category gets a 3-stop palette for a layered mesh look
const CAT_THEMES = {
  science: ['#0b1e5b','#1e5fd8','#4dd0e1'],
  design:  ['#4a1259','#a832a8','#ff6ec7'],
  tools:   ['#0a3d3a','#0f766e','#34e0c4'],
  art:     ['#6b1e0a','#d4571f','#ffc24d'],
  data:    ['#241a6b','#4f46e5','#8b9dff'],
  nature:  ['#0a3d1f','#1a8c42','#6ee87a'],
  culture: ['#5c1a0a','#d4551f','#ffb066'],
  games:   ['#5c0f3a','#c9265f','#ff7a5c'],
};
function hashStr(s) { let h=0; for (let i=0;i<s.length;i++){ h=(h<<5)-h+s.charCodeAt(i); h|=0; } return Math.abs(h); }
function initials(title) {
  const words = title.replace(/['"]/g,'').split(/\s+/).filter(w=>/[A-Za-z0-9]/.test(w));
  if (words.length === 1) return words[0].slice(0,2).toUpperCase();
  return (words[0][0] + words[1][0]).toUpperCase();
}
// A few pattern generators keyed off the site hash for visual variety
function patternSVG(h, c) {
  const kind = h % 4;
  const stroke = 'rgba(255,255,255,0.12)';
  const fill = 'rgba(255,255,255,0.07)';
  if (kind === 0) { // concentric rings
    let r = '';
    for (let i=1;i<=6;i++) r += `<circle cx="20" cy="80" r="${i*22}" fill="none" stroke="${stroke}" stroke-width="1.5"/>`;
    return r;
  } else if (kind === 1) { // diagonal grid
    let l = '';
    for (let i=-2;i<=10;i++) l += `<line x1="${i*26}" y1="0" x2="${i*26+120}" y2="200" stroke="${stroke}" stroke-width="1.2"/>`;
    return l;
  } else if (kind === 2) { // dot field
    let d = '';
    for (let x=0;x<8;x++) for (let y=0;y<6;y++) d += `<circle cx="${18+x*34}" cy="${20+y*34}" r="3" fill="${fill}"/>`;
    return d;
  } else { // arcs / waves
    let w = '';
    for (let i=0;i<5;i++) w += `<path d="M0 ${30+i*38} Q 70 ${i*38}, 140 ${30+i*38} T 280 ${30+i*38}" fill="none" stroke="${stroke}" stroke-width="1.4"/>`;
    return w;
  }
}
function showFallback(container, site) {
  const theme = CAT_THEMES[site.cat] || ['#1c1c28','#2a2a3a','#3a3a4a'];
  const h = hashStr(site.title);
  const ini = initials(site.title);
  const big = container.offsetWidth > 500;
  const iniSize = big ? '120px' : '52px';
  const titleSize = big ? '15px' : '11px';
  const favSize = big ? '24px' : '16px';
  const a1 = 15 + (h % 70);         // mesh light position 1
  const a2 = 20 + ((h>>3) % 70);
  const b1 = 60 + ((h>>5) % 40);
  const b2 = 55 + ((h>>7) % 40);
  const baseAngle = 120 + (h % 80);
  container.innerHTML = `
    <div style="position:absolute; inset:0; overflow:hidden;
      background:
        radial-gradient(circle at ${a1}% ${a2}%, ${theme[2]} 0%, transparent 45%),
        radial-gradient(circle at ${b1}% ${b2}%, ${theme[1]} 0%, transparent 55%),
        linear-gradient(${baseAngle}deg, ${theme[0]}, ${theme[1]});
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:${big?'14px':'8px'}; padding:14px; text-align:center;">
      <svg viewBox="0 0 280 200" preserveAspectRatio="xMidYMid slice" style="position:absolute; inset:0; width:100%; height:100%; opacity:0.9;">${patternSVG(h, theme)}</svg>
      <div style="position:absolute; inset:0; background:linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.28));"></div>
      <div style="font-family:'DM Serif Display',serif; font-size:${iniSize}; font-weight:700; color:rgba(255,255,255,0.97); line-height:1; letter-spacing:-2px; z-index:1; text-shadow:0 3px 24px rgba(0,0,0,0.35);">${ini}</div>
      <div style="z-index:1; font-family:'DM Mono',monospace; font-size:${titleSize}; color:rgba(255,255,255,0.92); font-weight:500; max-width:90%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${site.title}</div>
      <img src="${faviconUrl(site.url)}" alt="" style="z-index:1; width:${favSize}; height:${favSize}; border-radius:4px; opacity:0.95;" onerror="this.style.display='none'">
    </div>`;
}

// ── State ──
let currentCat='all', shuffled=[], shown=0;
const PAGE=24;

function filtered() { return currentCat==='all' ? SITES : SITES.filter(s=>s.cat===currentCat); }
function shuffle(arr) { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function makeCard(site) {
  const card = document.createElement('a');
  card.className = 'site-card';
  card.href = site.url; card.target='_blank'; card.rel='noopener noreferrer';
  card.innerHTML = `
    <div class="card-thumb"><div class="thumb-placeholder"><div class="mini-spin"></div></div></div>
    <div class="card-body">
      <div class="card-title">${site.title}</div>
      <div class="card-desc">${site.desc}</div>
      <div class="card-meta">
        <img class="card-favicon" src="${faviconUrl(site.url)}" alt="" onerror="this.style.display='none'">
        <span class="card-domain">${domain(site.url)}</span>
        <span class="card-tag">${site.tags[0]}</span>
      </div>
    </div>`;
  const thumbEl = card.querySelector('.card-thumb');
  const observer = new IntersectionObserver((entries)=>{
    if (entries[0].isIntersecting) { observer.disconnect(); loadShot(thumbEl, site, 500, false); }
  }, { rootMargin:'400px' });
  observer.observe(card);
  return card;
}

function renderMore() {
  const grid = document.getElementById('site-grid');
  const slice = shuffled.slice(shown, shown + PAGE);
  slice.forEach((s) => grid.appendChild(makeCard(s)));
  shown += slice.length;
  document.getElementById('load-more-wrap').classList.toggle('visible', shown < shuffled.length);
}

function hide(id) { document.getElementById(id).style.display='none'; }
function el(id) { return document.getElementById(id); }

// ── Wander: single-site hero, new random pick each time ──
let lastHeroUrl = null;
function wander() {
  hide('splash-state');
  hide('grid-section');
  el('load-more-wrap').classList.remove('visible');
  el('hero-section').classList.add('visible');

  const pool = filtered();
  let site = pool[Math.floor(Math.random()*pool.length)];
  // avoid repeating the same site twice in a row when the pool is big enough
  if (pool.length > 1) {
    let guard = 0;
    while (site.url === lastHeroUrl && guard++ < 20) site = pool[Math.floor(Math.random()*pool.length)];
  }
  lastHeroUrl = site.url;

  el('hero-title').textContent = site.title;
  el('hero-desc').textContent = site.desc;
  el('hero-url').textContent = domain(site.url);
  el('hero-visit').href = site.url;
  el('hero-tags').innerHTML = site.tags.map(t=>`<span class="tag">${t}</span>`).join('');

  const shot = el('hero-shot');
  shot.onclick = () => window.open(site.url, '_blank');
  shot.innerHTML = `<div class="thumb-placeholder"><div class="spinner"></div></div>`;
  loadShot(shot, site, 1000, true);

  window.scrollTo({ top:0, behavior:'smooth' });
}

// ── Browse: full grid (no hero) ──
function browseGrid() {
  hide('splash-state');
  el('hero-section').classList.remove('visible');
  el('grid-section').style.display='block';
  shuffled = shuffle(filtered());
  shown = 0;
  el('site-grid').innerHTML='';
  el('grid-count').textContent = shuffled.length + ' sites';
  renderMore();
  window.scrollTo({ top:0, behavior:'smooth' });
}

el('wander-btn').addEventListener('click', wander);
el('splash-cta').addEventListener('click', wander);
el('hero-next').addEventListener('click', wander);
el('hero-browse').addEventListener('click', browseGrid);
el('load-more-btn').addEventListener('click', renderMore);

el('nav-filters').addEventListener('click', e=>{
  const btn = e.target.closest('.pill'); if(!btn) return;
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active'); currentCat = btn.dataset.cat;
  // Clicking a category always opens the browsable grid for that category
  browseGrid();
});

// Populate dynamic site counts
(function(){ var n=SITES.length; var a=document.getElementById('splash-count'); var b=document.getElementById('browse-count'); if(a)a.textContent=n; if(b)b.textContent=n; })();

document.addEventListener('keydown', e=>{
  if (e.key===' ' && e.target.tagName!=='INPUT' && e.target.tagName!=='TEXTAREA') {
    e.preventDefault();
    wander();
  }
});
</script>
